packages:
  - 'apps/*'
  - 'packages/*'

# Seuls ces paquets sont autorisés à exécuter leurs scripts d'installation.
# Tout autre script est ignoré : c'est une mesure de sécurité de la chaîne
# d'approvisionnement, pas une commodité.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  # Télémétrie transitive : son script d'installation n'a rien à faire ici.
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Source unique de vérité des versions de dépendances.
# Les paquets du monorepo référencent "catalog:" au lieu d'un numéro de version.
catalog:
  # --- Socle ---
  # TypeScript reste en 5.9 : typescript-eslint 8 refuse explicitement TS >= 7
  # (réécriture Go), et NestJS s'appuie encore sur les décorateurs hérités avec
  # emitDecoratorMetadata. À réévaluer quand typescript-eslint publiera son
  # support de TS 7.
  typescript: ~5.9.3
  turbo: ^2.10.12
  prettier: ^3.9.6
  rimraf: ^6.0.1
  '@types/node': ^22.10.5

  # --- Qualité ---
  eslint: ^9.18.0
  '@eslint/js': ^9.18.0
  typescript-eslint: ^8.20.0
  eslint-config-prettier: ^9.1.0
  eslint-plugin-react-hooks: ^5.1.0
  globals: ^15.14.0

  # --- Tests ---

  # --- Contrats et validation ---
  zod: ^4.5.4

  # --- Frontend ---
  next: ^16.3.4
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.0.7
  '@types/react-dom': ^19.0.3
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  postcss: ^8.5.1
  '@tanstack/react-query': ^5.102.8
  react-hook-form: ^7.87.0
  '@hookform/resolvers': ^3.10.0
  zustand: ^5.0.15
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^2.6.0
  '@radix-ui/react-dialog': ^1.1.4
  '@radix-ui/react-popover': ^1.1.4
  '@radix-ui/react-select': ^2.1.4
  '@radix-ui/react-tabs': ^1.1.2
  '@radix-ui/react-tooltip': ^1.1.6
  '@radix-ui/react-checkbox': ^1.1.3
  '@radix-ui/react-radio-group': ^1.2.2
  '@radix-ui/react-switch': ^1.1.2
  '@radix-ui/react-separator': ^1.1.1
  '@radix-ui/react-slot': ^1.1.1
  date-fns: ^4.1.0
  lucide-react: ^0.460.0

  # --- Backend ---
  '@nestjs/common': ^12.0.1
  '@nestjs/core': ^12.0.1
  '@nestjs/platform-express': ^12.0.1
  '@nestjs/config': ^12.0.0
  '@nestjs/jwt': ^12.0.0
  '@nestjs/swagger': ^12.0.1
  '@nestjs/throttler': ^6.5.0
  '@nestjs/event-emitter': ^12.0.0
  '@nestjs/schedule': ^12.0.1
  '@nestjs/cli': ^12.0.0
  '@nestjs/schematics': ^12.0.0
  '@nestjs/testing': ^12.0.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  prisma: ^7.10.0
  '@prisma/client': ^7.10.0
  '@prisma/adapter-pg': ^7.10.0
  '@prisma/client-runtime-utils': ^7.10.0
  pg: ^8.23.0
  '@types/pg': ^8.23.1
  nestjs-zod: ^5.5.0
  nestjs-pino: ^4.3.0
  pino: ^9.6.0
  pino-http: ^10.4.0
  pino-pretty: ^13.0.0
  sharp: ^0.35.4
  cloudinary: ^2.11.0
  qrcode: ^1.5.4
  dexie: ^4.4.5
  '@zxing/browser': ^0.2.1
  '@noble/ed25519': ^3.2.0
  '@types/qrcode': ^1.5.6
  pdfkit: ^0.20.2
  '@types/pdfkit': ^0.17.6
  nodemailer: ^6.9.16
  '@types/nodemailer': ^6.4.17
  multer: ^2.3.0
  '@types/multer': ^2.2.0
  helmet: ^8.0.0
  cookie-parser: ^1.4.7
  '@types/cookie-parser': ^1.4.8
  '@types/express': ^5.0.0
  supertest: ^7.0.0
  '@types/supertest': ^6.0.2
  tsx: ^4.19.2
  dotenv: ^17.0.0

# ─────────────────────────────────────────────────────────────────────────────
# Corrections de sécurité forcées sur les dépendances transitives
# ─────────────────────────────────────────────────────────────────────────────
# `multer` arrive par @nestjs/platform-express, qui l'épingle sous la version
# corrigée. Trois avis de déni de service le concernent — noms de champs
# forgés, index de tableau surdimensionné, fuite de descripteurs sur envoi
# interrompu — et il est la voie d'entrée de TOUS les dépôts de fichiers du
# produit : visuels d'événements et pièces d'identité.
#
# `deepmerge-ts` et `mysql2` viennent de l'outillage. `mysql2` n'est même pas
# utilisé — le produit est sur PostgreSQL — mais une dépendance transitive
# vulnérable reste dans l'arbre installé, donc dans l'image de production.
overrides:
  multer: '>=2.3.0'
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.23.1'
